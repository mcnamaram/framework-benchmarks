# JUnit 6 Parallel Execution Configuration for API Tests
# Enables parallel test execution to cut feedback time on test runs
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.mode.methods.default = concurrent
junit.jupiter.execution.parallel.config.dynamic.factor = 2.0
junit.jupiter.execution.parallel.config.strategy = dynamic